name: PR checks

on:
  pull_request:
    branches: [ main ]

jobs:
  pr-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.12" ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Install the requirements
        run: uv sync --group dev

      - name: Replace the configuration
        run: |
          sed -i "s|template: injector/templates|template: $PWD/injector/templates|g" ./test/unittests/config/config.yml

      - name: Execute the unittests
        run: |
          export PYTHONPATH=$PYTHONPATH:$PWD/injector
          cd test/unittests
          export HANA_INJECTOR_CONFIG_FILE_PATH=$PWD/config/config.yml
          export HANA_INJECTOR_GENERATOR_MODE=True
          uv run pytest

  pr-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.12" ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Install the requirements
        run: uv sync --group dev

      - name: Execute the linting checks
        run: uv run ruff check injector/ test/

  pr-coverage:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.12" ]
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Install the requirements
        run: uv sync --group dev

      - name: Replace the configuration
        run: |
          sed -i "s|template: injector/templates|template: $PWD/injector/templates|g" ./test/unittests/config/config.yml

      - name: Generate the coverage report
        run: |
          export PYTHONPATH=$PYTHONPATH:$PWD/injector
          cd test/unittests
          export HANA_INJECTOR_CONFIG_FILE_PATH=$PWD/config/config.yml
          export HANA_INJECTOR_GENERATOR_MODE=True
          uv run pytest --junitxml=pytest.xml --cov=. --cov-report=xml:coverage.xml | tee pytest-coverage.txt

      - name: Execute the coverage checks
        uses: MishaKav/pytest-coverage-comment@v1.8.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pytest-coverage-path: ./test/unittests/pytest-coverage.txt
          junitxml-path: ./test/unittests/pytest.xml
          hide-badge: true
          create-new-commit: true

      - name: Generate coverage badge
        run: uv run genbadge coverage -i ./test/unittests/coverage.xml -o docs/coverage.svg

      - name: Check changed files
        uses: ZPascal/check-changed-files-action@v1
        id: verify-changed-files
        with:
          checked_location: 'docs'
          git_location: './'

      - name: Commit files
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add --force docs
          git commit -m "docs: Add coverage badge"

      - name: Push changes
        uses: ad-m/github-push-action@master
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.head_ref }}
          atomic: false

  pr-documentation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.12" ]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Install the requirements
        run: uv sync --extra docs

      - name: Build documentation
        run: uv run mkdocs build --config-file docs/mkdocs.yml