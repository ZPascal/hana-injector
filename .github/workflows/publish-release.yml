name: Build and publish

on:
  release:
    types: [ published ]

jobs:

  python-build-and-publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.x']

    steps:
      - name: Checkout the repository and the branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Install system dependencies
        run: sudo apt-get update && DEBIAN_FRONTEND=noninteractive sudo apt-get install -y python3-dev

      - name: Install the project dependencies
        run: uv sync --group dev --extra docs

      - name: Build a binary wheel and a source tarball
        run: uv run python -m build --sdist --wheel --outdir dist/

      - name: Setup the GitHub user
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Update the GitHub pages documentation
        run: uv run mkdocs build --config-file docs/mkdocs.yml && uv run mkdocs gh-deploy --config-file docs/mkdocs.yml --force

      - name: Publish distribution package to PyPI
        if: startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@master
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  docker-build-and-publish:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build the Docker image
        run: docker build . -t z9pascal/hana-injector:$(cat ./Dockerfile | grep -Po 'version="\K.*?(?=")')-latest

      - name: Relase the Docker image
        run: echo ${{ secrets.DOCKER_HUB_TOKEN }} | docker login -u z9pascal --password-stdin && docker push z9pascal/hana-injector:$(cat ./Dockerfile | grep -Po 'version="\K.*?(?=")')-latest
